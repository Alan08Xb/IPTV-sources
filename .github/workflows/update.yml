name: Auto Update IPTV Sources

on:
  schedule:
    # 每天北京时间 8:00, 18:00 运行
    - cron: '0 0,10 * * *'
  workflow_dispatch:  # 允许手动触发
  push:
    branches:
      - main  # 当main分支有推送时也运行

jobs:
  update-sources:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
    
    - name: Collect IPTV sources
      run: |
        python scripts/collect.py
    
    - name: Test channel speed
      run: |
        python scripts/test_speed.py
      timeout-minutes: 30  # 设置30分钟超时
    
    - name: Generate M3U files
      run: |
        python scripts/generate_m3u.py
    
    - name: Commit and push changes
      run: |
        git config --global user.name 'GitHub Actions Bot'
        git config --global user.email 'actions@github.com'
        git add output/ README.md
        git diff --quiet && git diff --staged --quiet || (
          git commit -m "Auto update IPTV sources [$(date +'%Y-%m-%d %H:%M:%S')]"
          git push
        )
